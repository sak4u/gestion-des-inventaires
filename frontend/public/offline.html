<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors-ligne — Gestion des Inventaires</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 360px; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin-bottom: 10px; color: #fff; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡❌</div>
    <h1>Vous êtes hors-ligne</h1>
    <p>Impossible de se connecter au serveur. Vérifiez votre connexion WiFi ou données mobiles, puis réessayez.</p>
    <button onclick="window.location.reload()">🔄 Réessayer</button>
  </div>
</body>
</html>
